services:
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      DATABASE_PATH: /data/taxcloud.db
    ports: ["8000:8000"]
    volumes: ["./backend/data:/data"]
    depends_on: [redis]
  worker1:
    build: ./backend
    command: python -m app.worker
    environment: {REDIS_URL: "redis://redis:6379/0", WORKER_NAME: "worker-1"}
    depends_on: [redis, api]
  worker2:
    build: ./backend
    command: python -m app.worker
    environment: {REDIS_URL: "redis://redis:6379/0", WORKER_NAME: "worker-2"}
    depends_on: [redis, api]
  worker3:
    build: ./backend
    command: python -m app.worker
    environment: {REDIS_URL: "redis://redis:6379/0", WORKER_NAME: "worker-3"}
    depends_on: [redis, api]
